<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand-badge">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.5 9.4 7.55 4.24a1.78 1.78 0 0 0-2.5 1.55v12.42a1.78 1.78 0 0 0 2.5 1.55L16.5 14.6a1.78 1.78 0 0 0 0-3.2z"></path>
      </svg>
    </div>

    <div class="auth-header">
      <h1 class="auth-title">Iniciar Sesión</h1>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>
    </div>

    <form (ngSubmit)="submit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
          <input
            id="email"
            name="email"
            type="email"
            class="form-input"
            placeholder="nombre@ejemplo.com"
            [(ngModel)]="email"
            required
            [disabled]="loading()"
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input
            id="password"
            name="password"
            type="password"
            class="form-input"
            placeholder="••••••••"
            [(ngModel)]="password"
            required
            [disabled]="loading()"
            autocomplete="current-password"
          />
        </div>
      </div>

      @if (errorMsg()) {
        <div class="auth-alert" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" x2="12" y1="8" y2="12"></line>
            <line x1="12" x2="12.01" y1="16" y2="16"></line>
          </svg>
          <span>{{ errorMsg() }}</span>
        </div>
      }

      <button
        type="submit"
        class="auth-submit-btn"
        [disabled]="loading() || loginForm.invalid"
      >
        @if (loading()) {
          <span class="auth-spinner" aria-hidden="true"></span>
          <span>Ingresando...</span>
        } @else {
          <span>Ingresar a la plataforma</span>
        }
      </button>

      <div class="auth-divider">
        <span>o</span>
      </div>

      <p class="auth-footer">
        ¿Aún no tienes cuenta? <a routerLink="/register" class="auth-link">Regístrate gratis</a>
      </p>
    </form>
  </div>
</div>
