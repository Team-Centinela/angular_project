<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Iniciar Sesión</h1>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder al catálogo</p>
    </div>

    <form (ngSubmit)="submit()" #loginForm="ngForm" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-input"
          placeholder="tu@correo.com"
          [(ngModel)]="email"
          required
          [disabled]="loading()"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="••••••••"
          [(ngModel)]="password"
          required
          [disabled]="loading()"
          autocomplete="current-password"
        />
      </div>

      @if (errorMsg()) {
        <div class="auth-alert" role="alert">
          {{ errorMsg() }}
        </div>
      }

      <button
        type="submit"
        class="auth-submit-btn"
        [disabled]="loading() || loginForm.invalid"
      >
        @if (loading()) {
          <span class="auth-spinner" aria-hidden="true"></span>
          <span>Ingresando...</span>
        } @else {
          <span>Ingresar</span>
        }
      </button>

      <p class="auth-footer">
        ¿No tienes cuenta? <a routerLink="/register" class="auth-link">Regístrate</a>
      </p>
    </form>
  </div>
</div>
