<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Crear Cuenta</h1>
      <p class="auth-subtitle">Regístrate para gestionar productos y favoritos</p>
    </div>

    <form (ngSubmit)="submit()" #registerForm="ngForm" class="auth-form">
      <div class="form-group">
        <label class="form-label" for="name">Nombre completo</label>
        <input
          id="name"
          name="name"
          type="text"
          class="form-input"
          placeholder="Tu nombre"
          [(ngModel)]="name"
          required
          [disabled]="loading()"
          autocomplete="name"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input
          id="email"
          name="email"
          type="email"
          class="form-input"
          placeholder="tu@correo.com"
          [(ngModel)]="email"
          required
          [disabled]="loading()"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="Mínimo 6 caracteres"
          [(ngModel)]="password"
          required
          minlength="6"
          [disabled]="loading()"
          autocomplete="new-password"
        />
        <span class="form-hint">Mínimo 6 caracteres.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="passwordConfirm">Confirmar contraseña</label>
        <input
          id="passwordConfirm"
          name="passwordConfirm"
          type="password"
          class="form-input"
          placeholder="Repite tu contraseña"
          [(ngModel)]="passwordConfirm"
          required
          [disabled]="loading()"
          autocomplete="new-password"
        />
      </div>

      @if (errorMsg()) {
        <div class="auth-alert" role="alert">
          {{ errorMsg() }}
        </div>
      }

      <button
        type="submit"
        class="auth-submit-btn"
        [disabled]="loading() || registerForm.invalid"
      >
        @if (loading()) {
          <span class="auth-spinner" aria-hidden="true"></span>
          <span>Registrando...</span>
        } @else {
          <span>Crear cuenta</span>
        }
      </button>

      <p class="auth-footer">
        ¿Ya tienes cuenta? <a routerLink="/login" class="auth-link">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
