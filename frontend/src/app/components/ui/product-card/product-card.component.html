<button type="button" class="card" (click)="onClick()">
  <div class="image-wrapper">
    @if (product().images && product().images.length > 0) {
      <img [src]="product().images[0].url" [alt]="product().name" class="image" />
    } @else {
      <div class="image placeholder">Sin imagen</div>
    }
  </div>

  <div class="body">
    <span class="category">{{ product().category.name }}</span>
    <h3 class="name">{{ product().name }}</h3>
    <p class="price">{{ product().price | currency:'COP':'symbol-narrow':'1.0-0' }}</p>
  </div>
</button>
